name: companion-app
services:
  api:
    image: companion-server:local
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    env_file: ../../apps/server/.env
    environment:
      SERVER_ADDR: 0.0.0.0:8080
      AGENT_URL: http://agent:8081
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agent
    restart: unless-stopped
  worker:
    image: companion-server:local
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    command: ["/app/worker"]
    env_file: ../../apps/server/.env
    environment:
      AGENT_URL: http://agent:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agent
    restart: unless-stopped
  agent:
    build:
      context: ../..
      dockerfile: apps/agent/Dockerfile
    env_file: ../../apps/agent/.env
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 8081
    restart: unless-stopped
